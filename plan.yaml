      Fill in stub bodies in src/core/config.ts and src/core/state.ts per core-contracts
      and core-tests.

      UPSTREAM ARTIFACTS: core-contracts exported config/state interfaces are AUTHORITATIVE;
      core-tests config/state assertions are PROTECTED.

      TARGET STATE: ConfigManager composes defaults, disk, launch, and runtime overlays
      with the documented precedence; serializes all runtime mutations through one
      FIFO queue; persists only validated canonical path patches atomically; and manages
      in-memory sensor/external/rendered state plus bounded lapse durable state exactly
      as specified.

      YOUR SCOPE: Replace NotImplementedError/pass/... markers with working logic
      inside existing signatures. Use Edit-style focused changes; if a contract artifact
      is wrong, record a deviation instead of silently rewriting public surfaces.

      Hardened acceptance: cover missing-file fallback, malformed config/state fallback,
      explicit delete/null semantics, partial-write failure, runtime-overridden-vs-launch
      precedence after reload, and FIFO conflict ordering.

      ## Completion Criteria (stub exclusion)

      This is an IMPLEMENTATION step. Stub-only completion is NOT acceptable. Each
      deliverable MUST contain substantive logic that processes inputs and produces
      outputs varying by inputs.

      <side_effect_budget>Allowed: src/core/config.ts, src/core/state.ts, focused
      test updates required by protected tests. Forbidden: project-local config discovery,
      implicit cwd walking, full-effective-config persistence, geo cache durability,
      external state durability, or request-path I/O.</side_effect_budget>

