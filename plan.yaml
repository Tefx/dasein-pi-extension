  - id: pi-runtime-tui-surfaces
    name: Complete status, widget, and SettingsList runtime surfaces
    status: pending
    description: 'step_type: implementation

      tags: [integration, client-surface]

      TARGET STATE: src/ui/status.ts, src/ui/widget.ts, and src/ui/settings.ts expose
      user-observable status footer, optional widget, and SettingsList configuration
      controls backed by real effective config/state/metadata and ConfigManager mutation
      semantics.

      ## Client Surface Completion Criteria (runtime output required)

      Completion requires BOTH logic correctness and surface completeness: fake-host
      TUI/status/widget/SettingsList output must be observable through captured UI
      calls or equivalent terminal/snapshot artifacts. View models alone do not satisfy
      this step.

      CONSTRAINTS: No DESIGN.md/design-system work; verify functional Pi TUI behavior
      and accessibility/visibility from specs, not visual design conformance. Object/array/map
      fields such as geo.tags and lapse.agentFields are not flat SettingsList controls.

      ## Completion Criteria (stub exclusion)

      This is an IMPLEMENTATION step. Stub-only completion is NOT acceptable.

      <side_effect_budget>Allowed: src/ui/status.ts, src/ui/widget.ts, src/ui/settings.ts,
      focused tests. Forbidden: design-token work, hiding privacy-sensitive geo state,
      direct config mutation outside ConfigManager, or TUI support claims without
      release smoke.</side_effect_budget>

      <risk_probes>1. SettingsList shows inspectability metadata before risky enablement
      controls. 2. Status/widget clear when disabled via setStatus/setWidget undefined.
      3. Runtime changes persist canonical paths only after validation/persistence
      succeeds.</risk_probes>


      REVIEW-FIX ITERATION 2 SETTINGSLIST COMMON SENSOR CONTROLS:

      SettingsList coverage must enumerate and prove every common sensor control required
      by the Technical Design: `enabled`, `ui`, `agent`, `intervalMs`, `timeoutMs`,
      `staleAfterMs`, and `initialRefresh`. Visible recurring interval controls and
      their ConfigManager mutation path are blocking evidence, not optional UI polish.


      REVIEW-FIX ITERATION 2 BARE `/dasein` OWNERSHIP:

      Bare `/dasein` is a required public command behavior, not an interchangeable
      alias. In TUI mode it MUST open the configuration UI/SettingsList. Outside TUI
      mode it MUST fall back to concise deterministic help/status output. It MUST
      NOT mutate config, disk, sensor state, or external state. Evidence must use
      the literal bare `/dasein`; substitute wording is insufficient.


      REVIEW-FIX ITERATION 3 SETTINGSLIST NEGATIVE EXTERNAL-KEY PROOF:

      SettingsList must NOT create controls for invalid external keys, dotted keys,
      expired external state, or malformed external events. This negative proof is
      blocking and distinct from positive common-control coverage and complex-field
      exclusion.


      REVIEW-FIX ITERATION 4 GEO EXACT PRIVACY FIELDS:

      Geo exact-location behavior must explicitly name and verify both `sensors.geo.exactCoordinates`
      and `sensors.geo.exactAddress`. Exact coordinate output requires `sensors.geo.agent
      === true`, `sensors.geo.precision === "exact"`, and `sensors.geo.exactCoordinates
      === true`. Exact address output requires `sensors.geo.agent === true`, `sensors.geo.precision
      === "exact"`, and `sensors.geo.exactAddress === true`. Broad "exact privacy
      gates" wording is insufficient.


      REVIEW-FIX ITERATION 5 PI RUNTIME DEPENDENCY REPAIR:

      This step depends on `pi-runtime-extension-wiring` because SettingsList/bare
      `/dasein` observable behavior consumes the Pi command/custom-UI registration
      path and shares `tests/integration/pi-extension.test.ts`.


      REVIEW-FIX ITERATION 6 USER-ADDED RISKY SENSOR INSPECTABILITY FIELDS:

      User-added/risky sensor inspectability must explicitly own and verify exact
      fields `acknowledgedManifestDigest`, `acknowledgementRequired`, `acknowledgementSatisfied`,
      `defaultEnabled`, and `effectiveEnabled`. Broad "acknowledgement" wording is
      insufficient; status, sensors, and SettingsList evidence must name all five
      fields where those surfaces expose sensor metadata.

      '
