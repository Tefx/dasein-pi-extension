      - [ ] Evidence proves literal bare `/dasein` is registered/routed and does not
      mutate config/state in either TUI or non-TUI mode.

      - [ ] Evidence explicitly probes `ctx.ui.custom`, wires SettingsList through
      it only when available, and reports fail-closed status when unavailable.

      '
