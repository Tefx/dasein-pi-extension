- id: core
  name: Core Broker Contracts and Implementation
  status: locked
  gate: Core broker behavior is contract-defined, tested, implemented, and independently
    verified against request-path and config/state invariants.
  context: Build the functional core contracts and executable core modules for config,
    typed state, sensor runtime, renderer/injector, external events, and command parsing.
  depends_on:
  - scaffold
- id: sensors
  name: Builtin Sensors and Native Helper
  status: locked
  gate: Builtin sensors publish typed state, geo helper is bounded/fail-closed, and
    sensor actions obey config mutation and privacy contracts.
  context: Deliver clock, lapse, geo, and macOS helper behavior while preserving the
    core-as-broker boundary.
  depends_on:
  - core
- id: pi_runtime
  name: Pi Runtime, Commands, and TUI Surfaces
  status: locked
  gate: Pi-facing runtime surfaces are wired, fake-host verified, and client/runtime
    observable without claiming live release support.
  context: Wire Dasein into Pi extension lifecycle, slash commands, flags, context
    hook, pi.events, status/widget, and SettingsList via fake-host CI proof.
  depends_on:
  - sensors
- id: system_wiring
  name: System Wiring and Ordinary CI Closure
  status: locked
  gate: No production stubs remain in entrypoints, ordinary CI gates pass, and fake-host
    end-to-end path reaches real modules.
  context: Connect module implementations through the real entrypoint and prove end-to-end
    data flow through fake Pi host and ordinary CI gates.
  depends_on:
  - pi_runtime
- id: release_smoke
  name: Live Pi and Native Release Smoke
  status: locked
  gate: Live smoke evidence exists or reports exact environment blockers; release
    support claims are not made from fake-host tests alone.
  context: Separate live Pi/native release evidence from ordinary CI by probing real
    Pi/TUI/native surfaces.
  depends_on:
  - system_wiring
- id: finalization
  name: Documentation Sync and Final Deep Review
  status: locked
  gate: Final gate opens only with doc sync, full conformance, wiring, architecture,
    black-box, and evidence-ledger closure.
  context: Synchronize docs with implementation evidence and run independent final
    conformance, wiring, architecture, and black-box audits.
  depends_on:
  - release_smoke
