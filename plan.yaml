    name: Define scaffold and fake-host contracts
    status: pending
    description: 'step_type: contract

      contract_purity: ENFORCED

      TARGET STATE: Package/tooling, root extension shim, fake Pi host API shape,
      and top-level TypeScript contracts are declared as acceptance-only stubs/types
      matching the approved architecture basis.

      TRACEABILITY MATRIX:

