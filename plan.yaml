      code, docs, and durable user config, but it explicitly may create, change, and
      remove a disposable local `.ts` sensor fixture under the test-controlled `<extension_root>/src/sensors`
      to prove dynamic reload. Evidence must include fixture path, before/after content
      summary, cleanup, and confirmation that no persistent product mutation remains.


      REVIEW-FIX ITERATION 8 RELEASE SMOKE SERIALIZATION:

      Live-smoke steps are intentionally serialized because they may use disposable
      Pi sessions, HOME/config roots, extension roots, sensor fixtures, native helper
      permissions, and runtime state. This prevents parallel smoke steps from sharing
      or corrupting disposable runtime resources.

