- id: release_smoke
  name: Live Pi and Native Release Smoke
  status: locked
  gate: Live smoke evidence exists or reports exact environment blockers; release
    support claims are not made from fake-host tests alone.
  context: Separate live Pi/native release evidence from ordinary CI by probing real
    Pi/TUI/native surfaces.
  depends_on:
  - system_wiring
  steps:
  - id: release-smoke-live-pi-tui
    name: Run live Pi TUI slash, context, status/widget, and SettingsList smoke
    status: pending
    description: 'step_type: verification

      verification_scope: full-plan-check

      PROOF ARTIFACT: Live Pi runtime smoke for user-visible Pi/TUI surfaces, separate
      from fake-host ordinary CI. This step may report exact environment blockers,
      but it must not convert fake-host proof into live support.

      Surface class: live Pi binary/process, slash command output, hidden context
      injection, status footer, widget, and SettingsList.

      Required environment evidence: Pi version, binary path, extension load path/symlink,
      command/test artifact, screenshots/snapshots/terminal captures when feasible,
      and exact blocker if unavailable.

      <side_effect_budget>Allowed: read-only/live smoke execution against a disposable
      Pi session and evidence capture. Forbidden: code edits, config permanence outside
      disposable test paths, support claims without observed live behavior, or DESIGN.md
      visual conformance work.</side_effect_budget>

      <risk_probes>1. SettingsList rendering and one safe interaction are observed
      in a live TUI, not just fake host. 2. Non-TUI mode does not crash on guarded
      UI calls. 3. Evidence statuses update only mechanisms actually observed live.</risk_probes>


      REVIEW-FIX ITERATION 1 LIVE MECHANISM COVERAGE EXPANSION:

      Live Pi smoke must explicitly exercise or precisely block all live-only mechanisms:
      launch flag parsing (`--dasein`), event publishing via `pi.events`, lifecycle
      observation (`input` or fallback `before_agent_start`, plus `agent_end`), and
      hidden custom-message context conversion, in addition to slash commands, context
      hook, status/widget, ctx.ui.custom, and SettingsList.


      REVIEW-FIX ITERATION 2 MINIMUM PI VERSION STATUS:

      Dasein status/runtime evidence must include exact `minimumPiVersion: "0.78.1"`,
      current Pi version capture when available, unavailable-version classification,
      and below-minimum classification without false support claims. Version support
      classification is separate from API feature probes: a sufficient version does
      not prove feature availability, and feature availability does not override a
      below-minimum version.


      REVIEW-FIX ITERATION 2 BARE `/dasein` OWNERSHIP:

      Bare `/dasein` is a required public command behavior, not an interchangeable
      alias. In TUI mode it MUST open the configuration UI/SettingsList. Outside TUI
      mode it MUST fall back to concise deterministic help/status output. It MUST
      NOT mutate config, disk, sensor state, or external state. Evidence must use
      the literal bare `/dasein`; substitute wording is insufficient.


      REVIEW-FIX ITERATION 2 SETTINGSLIST COMMON SENSOR CONTROLS:

      SettingsList coverage must enumerate and prove every common sensor control required
      by the Technical Design: `enabled`, `ui`, `agent`, `intervalMs`, `timeoutMs`,
      `staleAfterMs`, and `initialRefresh`. Visible recurring interval controls and
      their ConfigManager mutation path are blocking evidence, not optional UI polish.


      REVIEW-FIX ITERATION 5 CTX.UI.CUSTOM FEATURE PROBE:

      Pi feature-probe and live/support evidence must explicitly include `ctx.ui.custom`
      as the custom UI mechanism used with SettingsList. `SettingsList` alone is insufficient;
      status must report `ctx.ui.custom` availability/unavailability separately enough
      to avoid false support claims.

      '
    verification: '- [ ] `npm run test:smoke -- tests/smoke/pi-settings-list.test.ts`
      or the documented live Pi equivalent is run with raw stdout/stderr, Pi version,
      and binary path.

      - [ ] Evidence shows literal bare `/dasein` output plus separately named `/dasein
      status` and `/dasein sensors` slash output, context hook injection behavior,
      status/widget rendering/clearing, SettingsList visible content, and one safe
      setting interaction.

      - [ ] If blocked, evidence states the exact missing Pi binary, version, TUI
      target, permissions, extension load path, or command needed; fake-host evidence
      is not counted as live proof.

      - [ ] Mechanism evidenceStatuses are updated/assessed only for observed live
