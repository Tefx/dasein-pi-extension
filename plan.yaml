  - id: finalization-architecture-concurrency-review
    name: Architecture, lifecycle, and concurrency review
    status: pending
    description: 'step_type: audit

      verification_scope: full-plan-check

      CONFORMANCE ARTIFACT: Independent architecture/concurrency review of module
      boundaries, state ownership, lifecycle cleanup, config mutation serialization,
      render invalidation timers, sensor refresh concurrency, helper supervision,
      and Pi/runtime event ordering.

      <side_effect_budget>Allowed: read-only architecture/code/evidence review. Forbidden:
      code/docs edits, re-deriving a new architecture that contradicts the approved
      basis without flagging conflict, or approving hidden shared mutable state risks
      without disposition.</side_effect_budget>

      <risk_probes>1. Single FIFO config queue prevents concurrent mutation races.
      2. Sensor runtime enforces one active refresh and cleanup timeout semantics.
      3. Request-path injection cannot race with disk/native/dynamic import work.</risk_probes>


      REVIEW-FIX CATCHUP RENDER HOOK PURITY:

      Adversarial render hook proof must show `renderAgent`/`renderUI` hooks cannot
      perform I/O, refresh/action, config mutation, durable-state access, discovery,
      helper/native imports, or own final prompt/UI strings. Enforceability must be
      explicit as static/contract/runtime fake proof, not broad injector no-I/O.

      '
    verification: '- [ ] Review confirms core/sensor/Pi UI boundary direction matches
      Constitution and architecture basis or lists exact conflicts.

      - [ ] Review inventories module-level mutable state, timers, queues, subprocesses,
      and caches with concurrency/cleanup/reset/bounded-growth semantics.

      - [ ] Review confirms lifecycle shutdown aborts sensors/helpers and no request-path
      I/O/race path remains.

      - [ ] Any architecture/concurrency blocker has remediation owner or explicit
      non-intersection evidence for final gate.

      - [ ] Architecture review checks renderer hook purity boundaries and enforceability
      disposition.

      '
