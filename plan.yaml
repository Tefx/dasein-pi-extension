      verification_scope: phase-check

      DECISION ARTIFACT: Independent gate for Pi runtime. Review fake-host runtime
      proof, spec conformance, evidence status separation, client-surface liveness,
      and user-visible TUI/CLI behavior before system wiring.

      review_depth: THOROUGH

      cross_cutting_focus: runtime entrypoint liveness, fake-vs-live distinction,
