      <side_effect_budget>Allowed: create package/tooling contract stubs and fake-host
      test contract files. Forbidden: runtime sensor logic, persistent state writes,
      live Pi smoke claims.</side_effect_budget>

      <risk_probes>1. Root shim does no work except delegation. 2. Runtime dependencies
      remain empty except Pi peer dependencies. 3. Fake host does not imply live support
