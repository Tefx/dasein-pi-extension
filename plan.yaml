  steps:
  - id: finalization-doc-sync
    name: Sync documentation with implemented behavior and evidence ledger
    status: pending
    description: 'step_type: implementation

      TARGET STATE: Project docs match implemented behavior, support-claim status,
      command/config formats, install modes, live/fake evidence distinctions, and
      any accepted blockers or deferred live support statuses.

      BOUNDING BOX: README/package docs if present, CONSTITUTION references only if
      an amendment is explicitly required, docs/PRD.md, docs/TECHNICAL_DESIGN.md,
      and any generated evidence ledger/doc sections created by implementers.

      CONSTRAINTS: Do not weaken the Constitution or rewrite requirements to fit implementation
      bugs; document implemented behavior only after gates prove it or record blockers/pending
      support claims explicitly.

      <side_effect_budget>Allowed: documentation/evidence-ledger updates by the execution
      agent. Forbidden: product code changes, false support claims, deleting unmet
      requirements, or DESIGN.md/design-system work.</side_effect_budget>

      <risk_probes>1. Fake-host/API evidence is never worded as live support. 2. README/examples,
      if present, match actual package scripts and slash/flag syntax. 3. Docs preserve
      global config path and no project-local config rules.</risk_probes>


      REVIEW-FIX CATCHUP CONSTITUTION AMENDMENT CONTROL:

      `finalization-doc-sync` must not amend `CONSTITUTION.md` unless explicit human
      approval is provided. If CONSTITUTION.md is changed, evidence must include human
      approval, amendment reason, affected invariants, verification impact, and migration
      notes. Normal doc sync should update non-constitution docs/evidence ledgers
      without weakening constitutional rules.

      '
