      classification is separate from API feature probes: a sufficient version does
      not prove feature availability, and feature availability does not override a
      below-minimum version.


      REVIEW-FIX ITERATION 2 BARE `/dasein` OWNERSHIP:

      Bare `/dasein` is a required public command behavior, not an interchangeable
      alias. In TUI mode it MUST open the configuration UI/SettingsList. Outside TUI
      mode it MUST fall back to concise deterministic help/status output. It MUST
      NOT mutate config, disk, sensor state, or external state. Evidence must use
      the literal bare `/dasein`; substitute wording is insufficient.


      REVIEW-FIX ITERATION 2 SETTINGSLIST COMMON SENSOR CONTROLS:

      SettingsList coverage must enumerate and prove every common sensor control required
      by the Technical Design: `enabled`, `ui`, `agent`, `intervalMs`, `timeoutMs`,
      `staleAfterMs`, and `initialRefresh`. Visible recurring interval controls and
      their ConfigManager mutation path are blocking evidence, not optional UI polish.


      REVIEW-FIX ITERATION 3 SETTINGSLIST NEGATIVE EXTERNAL-KEY PROOF:

      SettingsList must NOT create controls for invalid external keys, dotted keys,
      expired external state, or malformed external events. This negative proof is
      blocking and distinct from positive common-control coverage and complex-field
      exclusion.


