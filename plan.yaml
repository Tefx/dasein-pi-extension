  - id: finalization-full-spec-conformance
    name: Full spec conformance audit
    status: pending
    description: 'step_type: audit

      verification_scope: full-plan-check

      CONFORMANCE ARTIFACT: Independent full-system adversarial conformance audit
      against CONSTITUTION.md, docs/PRD.md, and docs/TECHNICAL_DESIGN.md. Focus on
      emergent/cross-phase drift not already closed by per-phase gates.

      SCOPE: config precedence, request-path safety, typed-state envelope, builtin/user-added
      sensors, commands, external events, renderer/injector, Pi runtime, support claim
      statuses, docs sync, and release smoke dispositions.

      <side_effect_budget>Allowed: read-only spec/code/evidence review. Forbidden:
      product edits, updating docs, or approving behavior from absence of known defects
      instead of positive proof.</side_effect_budget>

      <risk_probes>1. Requirement-to-checklist matrix has no orphan requirements.
      2. Behavioral precedence claims have runtime/test evidence or NEEDS_TEST closure.
      3. Final docs do not contradict implemented behavior or evidence status.</risk_probes>


      REVIEW-FIX ITERATION 2 MINIMUM PI VERSION STATUS:

      Dasein status/runtime evidence must include exact `minimumPiVersion: "0.78.1"`,
      current Pi version capture when available, unavailable-version classification,
      and below-minimum classification without false support claims. Version support
      classification is separate from API feature probes: a sufficient version does
      not prove feature availability, and feature availability does not override a
      below-minimum version.


      REVIEW-FIX ITERATION 2 SETTINGSLIST COMMON SENSOR CONTROLS:

      SettingsList coverage must enumerate and prove every common sensor control required
      by the Technical Design: `enabled`, `ui`, `agent`, `intervalMs`, `timeoutMs`,
      `staleAfterMs`, and `initialRefresh`. Visible recurring interval controls and
      their ConfigManager mutation path are blocking evidence, not optional UI polish.


      REVIEW-FIX ITERATION 3 STATUS/RELOAD PAYLOAD FIELDS:

      The plan explicitly owns the `/dasein status` payload fields `effectiveConfigVersion`,
      `launchArgsApplied`, and `diskConfigLoaded`, and the reload payload/result fields
      `launchReappliedPaths` and `runtimeOverriddenPaths`. Broad “payload shape” wording
      is insufficient; evidence must name these fields and show values in success
      and relevant failure/reload cases.


      REVIEW-FIX ITERATION 3 SETTINGSLIST NEGATIVE EXTERNAL-KEY PROOF:

      SettingsList must NOT create controls for invalid external keys, dotted keys,
      expired external state, or malformed external events. This negative proof is
      blocking and distinct from positive common-control coverage and complex-field
      exclusion.


      REVIEW-FIX ITERATION 4 GEO EXACT PRIVACY FIELDS:

      Geo exact-location behavior must explicitly name and verify both `sensors.geo.exactCoordinates`
      and `sensors.geo.exactAddress`. Exact coordinate output requires `sensors.geo.agent
      === true`, `sensors.geo.precision === "exact"`, and `sensors.geo.exactCoordinates
      === true`. Exact address output requires `sensors.geo.agent === true`, `sensors.geo.precision
      === "exact"`, and `sensors.geo.exactAddress === true`. Broad "exact privacy
      gates" wording is insufficient.


      REVIEW-FIX ITERATION 4 CORE CONFIG VALIDATION DETAILS:

      Core config validation must deterministically enforce `core.maxAgentChars` as
      an integer in the inclusive range `40..2000` and `core.injectedLabel` as a string
      matching regex `[A-Za-z0-9_.:-]{1,32}`. Evidence must include boundary accepts/rejects
      and must not rely on broad config-validation wording.


      REVIEW-FIX ITERATION 4 GEO TAG COMMAND DETAILS:

      Geo tag command coverage must explicitly verify `radius_m` integer bounds `1..100000`,
      the `GeoTagListPayload` shape, and coordinate redaction controlled by `sensors.geo.exactCoordinates`.
      Broad geo tag behavior wording is insufficient.


      REVIEW-FIX ITERATION 5 CTX.UI.CUSTOM FEATURE PROBE:

      Pi feature-probe and live/support evidence must explicitly include `ctx.ui.custom`
      as the custom UI mechanism used with SettingsList. `SettingsList` alone is insufficient;
      status must report `ctx.ui.custom` availability/unavailability separately enough
      to avoid false support claims.


      REVIEW-FIX ITERATION 6 USER-ADDED RISKY SENSOR INSPECTABILITY FIELDS:

      User-added/risky sensor inspectability must explicitly own and verify exact
      fields `acknowledgedManifestDigest`, `acknowledgementRequired`, `acknowledgementSatisfied`,
      `defaultEnabled`, and `effectiveEnabled`. Broad "acknowledgement" wording is
      insufficient; status, sensors, and SettingsList evidence must name all five
      fields where those surfaces expose sensor metadata.


      REVIEW-FIX ITERATION 6 NATIVE HELPER DETERMINISTIC CONSTANTS:

      Native helper supervision must explicitly verify timeout `3000ms`, graceful
      kill grace `250ms`, and backoff sequence `1m -> 5m -> 15m`. Broad timeout/backoff/cleanup
      wording is insufficient.


      REVIEW-FIX ITERATION 6 CONTEXT INJECTION CUSTOMMESSAGE FIELDS:

      Context injection proof must explicitly verify hidden Pi `CustomMessage` fields:
      `display:false`, `customType:"dasein"`, deterministic timestamp shape, and conversion
      to an LLM user message. Broad context-hook or hidden-message wording is insufficient.


      REVIEW-FIX ITERATION 6 LIFECYCLE EXACT PROOF:

      Lifecycle proof must explicitly verify `session_start`, `session_shutdown`,
      and `1000ms` per-sensor cleanup timeout. Shutdown must abort active refresh/helper
      work and aggregate cleanup errors without blocking request construction.


      REVIEW-FIX ITERATION 8 RENDER INVALIDATION SCHEDULER PROOF:

      Renderer proof must explicitly verify exactly one in-memory invalidation timer
      scheduled at the minimum upcoming sensor stale deadline or external expiresAt,
      cancellation/no timer when no deadlines exist, stale/expired recompute after
      timer fire, and no request-path scheduling/I/O.


      REVIEW-FIX ITERATION 8 ATOMIC WRITE FSYNC PROOF:

      Atomic config/durable-state writes must explicitly write a complete candidate
      JSON document to a temp file in the same directory, fsync when the platform
      exposes it, and rename over the target atomically. Failed writes must leave
      previous files and active runtime unchanged.


      REVIEW-FIX ITERATION 8 EXTERNAL EVENT UNICODE SEPARATOR REJECTION:

      External event validation must explicitly reject Unicode line separator U+2028
      and paragraph separator U+2029 in `agent`, `ui`, and `source` strings, in addition
      to ASCII control characters, CR, LF, and multiline payloads. Dasein must reject
      without normalizing or mutating state.


      REVIEW-FIX CATCHUP CONSTITUTION AMENDMENT CONTROL:

      `finalization-doc-sync` must not amend `CONSTITUTION.md` unless explicit human
      approval is provided. If CONSTITUTION.md is changed, evidence must include human
      approval, amendment reason, affected invariants, verification impact, and migration
      notes. Normal doc sync should update non-constitution docs/evidence ledgers
      without weakening constitutional rules.


      REVIEW-FIX CATCHUP NEGATIVE SENSOR DIRECTORY RULE:

      Dasein must ignore/reject `~/.pi/dasein/sensors`; user-added sensors load only
      from `<extension_root>/src/sensors/*.ts` in directory/package mode. No scanner,
      fallback, or reload path may treat `~/.pi/dasein/sensors` as a sensor directory.


      REVIEW-FIX CATCHUP NATIVE HELPER OUTPUT CAPS:

      Native helper stdout and stderr collection must each stop at `16KiB`. Later
      proof/gates must explicitly review this cap instead of relying on broad helper
      cleanup evidence.


      REVIEW-FIX CATCHUP RENDER HOOK PURITY:

      Adversarial render hook proof must show `renderAgent`/`renderUI` hooks cannot
      perform I/O, refresh/action, config mutation, durable-state access, discovery,
      helper/native imports, or own final prompt/UI strings. Enforceability must be
      explicit as static/contract/runtime fake proof, not broad injector no-I/O.

      '
