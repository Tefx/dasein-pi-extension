      boundaries, or an exact environment blocker is reported.

      Required path: real Pi process in directory/package install mode -> add/change
      local `.ts` sensor under `<extension_root>/src/sensors` -> `/dasein reload`
      -> old registry kept on failure and changed module loaded on success.

      <side_effect_budget>Allowed: disposable local sensor fixture under test extension
      root and live smoke evidence. Forbidden: production config pollution, automatic
      watchers, single-file package support claims for user-added sensors, or fake-host
      substitution.</side_effect_budget>

