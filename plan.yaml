  - id: release-smoke-gate
    name: Gate live Pi and native release smoke
    status: pending
    description: 'step_type: gate

      verification_scope: full-plan-check

      DECISION ARTIFACT: Independent gate for release-smoke evidence. The gate may
      open for implementation completion with explicit live-support blockers/pending
      statuses only if ordinary CI/fake-host proof is intact and no false live support
      claim remains.

      review_depth: THOROUGH

      cross_cutting_focus: live vs fake evidence separation, SettingsList live observability,
      dynamic reload live proof, native helper smoke/skip classification, support-claim
      ledger closure paths.

      <side_effect_budget>Allowed: read-only gate review. Forbidden: implementation
      fixes, upgrading evidence statuses, or hiding environment blockers.</side_effect_budget>

      <risk_probes>1. Release support claims are blocked until live evidence exists.
      2. Environment blockers are precise enough for a future rerun. 3. Fake-host
      proof remains usable for ordinary CI without being overstated.</risk_probes>


      REVIEW-FIX ITERATION 2 MINIMUM PI VERSION STATUS:

      Dasein status/runtime evidence must include exact `minimumPiVersion: "0.78.1"`,
      current Pi version capture when available, unavailable-version classification,
      and below-minimum classification without false support claims. Version support
      classification is separate from API feature probes: a sufficient version does
      not prove feature availability, and feature availability does not override a
      below-minimum version.


      REVIEW-FIX ITERATION 2 BARE `/dasein` OWNERSHIP:

      Bare `/dasein` is a required public command behavior, not an interchangeable
      alias. In TUI mode it MUST open the configuration UI/SettingsList. Outside TUI
      mode it MUST fall back to concise deterministic help/status output. It MUST
      NOT mutate config, disk, sensor state, or external state. Evidence must use
      the literal bare `/dasein`; substitute wording is insufficient.


      REVIEW-FIX ITERATION 4 RELEASE GATE VERDICT VOCABULARY:

      Allowed release-smoke gate verdicts are exactly `OPEN`, `OPEN_WITH_LIVE_SUPPORT_PENDING`,
      or `BLOCKED`. `OPEN_WITH_LIVE_SUPPORT_PENDING` is allowed only when ordinary
      CI/fake-host proof is intact, implementation completion is not blocked, every
      missing live item has exact environment/permission/command closure path, and
      no docs/status/support claim represents pending live behavior as verified release
      support.


      REVIEW-FIX ITERATION 5 CTX.UI.CUSTOM FEATURE PROBE:

      Pi feature-probe and live/support evidence must explicitly include `ctx.ui.custom`
      as the custom UI mechanism used with SettingsList. `SettingsList` alone is insufficient;
      status must report `ctx.ui.custom` availability/unavailability separately enough
      to avoid false support claims.


      REVIEW-FIX ITERATION 6 NATIVE HELPER DETERMINISTIC CONSTANTS:

      Native helper supervision must explicitly verify timeout `3000ms`, graceful
      kill grace `250ms`, and backoff sequence `1m -> 5m -> 15m`. Broad timeout/backoff/cleanup
      wording is insufficient.


      REVIEW-FIX ITERATION 6 CONTEXT INJECTION CUSTOMMESSAGE FIELDS:

      Context injection proof must explicitly verify hidden Pi `CustomMessage` fields:
      `display:false`, `customType:"dasein"`, deterministic timestamp shape, and conversion
      to an LLM user message. Broad context-hook or hidden-message wording is insufficient.


      REVIEW-FIX ITERATION 6 LIFECYCLE EXACT PROOF:

      Lifecycle proof must explicitly verify `session_start`, `session_shutdown`,
      and `1000ms` per-sensor cleanup timeout. Shutdown must abort active refresh/helper
      work and aggregate cleanup errors without blocking request construction.


      REVIEW-FIX ITERATION 8 RELEASE SMOKE SERIALIZATION:

      Live-smoke steps are intentionally serialized because they may use disposable
      Pi sessions, HOME/config roots, extension roots, sensor fixtures, native helper
      permissions, and runtime state. This prevents parallel smoke steps from sharing
      or corrupting disposable runtime resources.

      '
    verification: '- [ ] All release_smoke steps are complete with refs confirmations
