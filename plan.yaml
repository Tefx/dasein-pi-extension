  name: Pi Runtime, Commands, and TUI Surfaces
  status: locked
  gate: Pi-facing runtime surfaces are wired, fake-host verified, and client/runtime
    observable without claiming live release support.
  context: Wire Dasein into Pi extension lifecycle, slash commands, flags, context
    hook, pi.events, status/widget, and SettingsList via fake-host CI proof.
  depends_on:
  - sensors
  steps:
  - id: pi-runtime-tests
    name: Define expected-red Pi runtime and fake-host integration tests
    status: pending
    description: 'step_type: test

      step_intent: test_define_red

      expected_result: red

      PROOF ARTIFACT: Test-only suite exposes missing Pi extension wiring for root/src
      entrypoints, registerCommand, registerFlag, context hook, pi.events, lifecycle
      hooks, status/widget, SettingsList, and fake-host observable output.

      TRACEABILITY MATRIX:

      | requirement_id | source_ref + key passage | obligation | owning_step_id |
      checklist_item | evidence_field | status | non_intersection_or_escalation |

      | pi.entrypoint | TECHNICAL_DESIGN > Module Structure/Data Flow | root shim
      delegates and src/index composes extension runtime | pi-runtime-tests | entrypoint
      fake-host tests defined | expected_red_output | OWNED | n/a |

      | pi.mechanisms | TECHNICAL_DESIGN > Verified Pi Mechanisms | Pi APIs preserve
      SOURCE/API vs LIVE status distinction | pi-runtime-tests | mechanism tests defined
      | expected_red_output | OWNED | live proof owned by release_smoke |

      | pi.tui | PRD > Human TUI Surfaces | status/widget/ctx.ui.custom/SettingsList
      expose config/state visibly | pi-runtime-tests | TUI fake-host tests defined
      | expected_red_output | OWNED | live TUI proof owned by release_smoke |

      BOUNDING BOX: tests/integration/pi-extension.test.ts, tests/unit/settings-list.test.ts,
      fake Pi host fixtures, root index/src index fixtures.

      CONSTRAINTS: Tests/fixtures only; product runtime wiring is forbidden here.
      Fake-host proof must be labeled API_VERIFIED/LIVE_SMOKE_PENDING, not LIVE_SMOKE_VERIFIED.

      <side_effect_budget>Allowed: integration/unit tests and fake-host fixtures.
      Forbidden: product Pi wiring, live support claims, DESIGN.md/design-system work,
      or running live Pi smoke in ordinary npm test.</side_effect_budget>

      <risk_probes>1. Fake host cannot satisfy release support claims. 2. TUI-only
      surfaces are guarded by ctx.mode === "tui". 3. SettingsList test asserts visible
      content/control data, not just view model existence.</risk_probes>


      REVIEW-FIX ITERATION 1 PI FEATURE PROBES:

      Startup/runtime wiring must feature-probe required Pi mechanisms (`registerCommand`,
      `registerFlag`, `context`, `pi.events`, `setStatus`, `setWidget`, `ctx.ui.custom`,
      `SettingsList`, lifecycle/input/agent_end hooks) and fail closed per mechanism
      when unavailable. `/dasein status` must report structured `PiMechanismError`/evidence
      status instead of crashing or silently claiming support.


      REVIEW-FIX ITERATION 2 MINIMUM PI VERSION STATUS:

      Dasein status/runtime evidence must include exact `minimumPiVersion: "0.78.1"`,
      current Pi version capture when available, unavailable-version classification,
      and below-minimum classification without false support claims. Version support
      classification is separate from API feature probes: a sufficient version does
      not prove feature availability, and feature availability does not override a
      below-minimum version.


      REVIEW-FIX ITERATION 2 BARE `/dasein` OWNERSHIP:

      Bare `/dasein` is a required public command behavior, not an interchangeable
      alias. In TUI mode it MUST open the configuration UI/SettingsList. Outside TUI
      mode it MUST fall back to concise deterministic help/status output. It MUST
      NOT mutate config, disk, sensor state, or external state. Evidence must use
      the literal bare `/dasein`; substitute wording is insufficient.


      REVIEW-FIX ITERATION 2 SETTINGSLIST COMMON SENSOR CONTROLS:

      SettingsList coverage must enumerate and prove every common sensor control required
      by the Technical Design: `enabled`, `ui`, `agent`, `intervalMs`, `timeoutMs`,
      `staleAfterMs`, and `initialRefresh`. Visible recurring interval controls and
      their ConfigManager mutation path are blocking evidence, not optional UI polish.


      REVIEW-FIX ITERATION 3 SETTINGSLIST NEGATIVE EXTERNAL-KEY PROOF:

      SettingsList must NOT create controls for invalid external keys, dotted keys,
      expired external state, or malformed external events. This negative proof is
      blocking and distinct from positive common-control coverage and complex-field
      exclusion.


      REVIEW-FIX ITERATION 4 GEO EXACT PRIVACY FIELDS:

      Geo exact-location behavior must explicitly name and verify both `sensors.geo.exactCoordinates`
      and `sensors.geo.exactAddress`. Exact coordinate output requires `sensors.geo.agent
      === true`, `sensors.geo.precision === "exact"`, and `sensors.geo.exactCoordinates
      === true`. Exact address output requires `sensors.geo.agent === true`, `sensors.geo.precision
      === "exact"`, and `sensors.geo.exactAddress === true`. Broad "exact privacy
      gates" wording is insufficient.


      REVIEW-FIX ITERATION 5 CTX.UI.CUSTOM FEATURE PROBE:

      Pi feature-probe and live/support evidence must explicitly include `ctx.ui.custom`
      as the custom UI mechanism used with SettingsList. `SettingsList` alone is insufficient;
      status must report `ctx.ui.custom` availability/unavailability separately enough
      to avoid false support claims.

      '
