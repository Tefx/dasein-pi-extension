  - id: pi-runtime-extension-wiring
    name: Complete Pi entrypoint, hooks, commands, flag, and events wiring
    status: pending
    description: 'step_type: implementation

      tags: [integration]

      Fill in stub bodies in root index.ts and src/index.ts per scaffold/core/sensors
      contracts and pi-runtime-tests.

      TARGET STATE: The Pi extension runtime composes real core and sensor modules,
      registers `/dasein`, `--dasein` string flag, `context` injection, `pi.events`
      set/clear subscribers, session lifecycle/cleanup, input/before_agent_start/agent_end
      observation for lapse, and TUI status/widget update hooks with mechanism evidence
      statuses.

      UPSTREAM ARTIFACTS: scaffold root shim contract, core command/injector/event/lifecycle
      APIs, sensors implementations, and fake-host tests are PROTECTED.

      YOUR SCOPE: Runtime wiring and lifecycle plumbing only; do not change core semantics
      or sensor business logic.

      ## Completion Criteria (stub exclusion)

      This is an IMPLEMENTATION step. Stub-only completion is NOT acceptable; private
      `_Runtime*`, `_Stub*`, or `_Placeholder*` classes wired as production dependencies
      do not satisfy completion.

      <side_effect_budget>Allowed: root index.ts, src/index.ts, narrow Pi runtime
      adapters/fake-host compatibility tests. Forbidden: hidden live support claims,
      unguarded TUI calls outside tui mode, request-path I/O, or bypassing core command/config
      mediation.</side_effect_budget>

      <risk_probes>1. Context hook appends hidden custom message only from pre-rendered
      memory. 2. Lifecycle cleanup aborts sensors/helpers without blocking request
      construction. 3. Pi mechanism status reports live-smoke pending until release_smoke
      proves otherwise.</risk_probes>


      REVIEW-FIX ITERATION 1 PI FEATURE PROBES:

      Startup/runtime wiring must feature-probe required Pi mechanisms (`registerCommand`,
      `registerFlag`, `context`, `pi.events`, `setStatus`, `setWidget`, `ctx.ui.custom`,
      `SettingsList`, lifecycle/input/agent_end hooks) and fail closed per mechanism
      when unavailable. `/dasein status` must report structured `PiMechanismError`/evidence
      status instead of crashing or silently claiming support.


      REVIEW-FIX ITERATION 2 MINIMUM PI VERSION STATUS:

      Dasein status/runtime evidence must include exact `minimumPiVersion: "0.78.1"`,
      current Pi version capture when available, unavailable-version classification,
      and below-minimum classification without false support claims. Version support
      classification is separate from API feature probes: a sufficient version does
      not prove feature availability, and feature availability does not override a
      below-minimum version.


      REVIEW-FIX ITERATION 2 BARE `/dasein` OWNERSHIP:

      Bare `/dasein` is a required public command behavior, not an interchangeable
      alias. In TUI mode it MUST open the configuration UI/SettingsList. Outside TUI
      mode it MUST fall back to concise deterministic help/status output. It MUST
      NOT mutate config, disk, sensor state, or external state. Evidence must use
      the literal bare `/dasein`; substitute wording is insufficient.


      REVIEW-FIX ITERATION 5 CTX.UI.CUSTOM FEATURE PROBE:

      Pi feature-probe and live/support evidence must explicitly include `ctx.ui.custom`
      as the custom UI mechanism used with SettingsList. `SettingsList` alone is insufficient;
      status must report `ctx.ui.custom` availability/unavailability separately enough
      to avoid false support claims.

      '
