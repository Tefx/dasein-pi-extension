      - [ ] Gate decision basis reviews `session_start`, `session_shutdown`, and `1000ms`
      cleanup timeout live/support-ledger evidence.

      - [ ] Evidence records serialized execution assumptions and confirms disposable
      runtime/config/extension/native resources are cleaned up before the next release-smoke
      step consumes them.

      '
