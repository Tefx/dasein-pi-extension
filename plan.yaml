  steps:
  - id: system-wiring-stub-replacement
    name: Replace placeholders and production stubs with real modules
    status: pending
    description: 'step_type: implementation

      tags: [integration]

      TARGET STATE: Production entrypoints and runtime composition use real core,
      sensor, command, UI, native-helper, and Pi adapter modules; no `_Runtime*`,
      `_Stub*`, `_Placeholder*`, hardcoded default-only, or parameter-discarding production
      dependencies remain wired into index.ts/src/index.ts.

      BOUNDING BOX: index.ts, src/index.ts, src/core/*, src/commands/*, src/ui/*,
      src/sensors/*, src/native helper wrapper.

      CONSTRAINTS: This is the serial integration seam after parallel module work;
      do not reimplement modules, only connect final implementations and remove placeholders.

      ## Completion Criteria (stub exclusion)

      This is an IMPLEMENTATION step. Stub-only completion is NOT acceptable. Each
      production dependency must process inputs and produce outputs that vary by inputs.

      <side_effect_budget>Allowed: runtime composition/wiring/export cleanup and minimal
      adapter glue. Forbidden: broad semantic rewrites of core/sensors/UI, new public
      contracts, fake-live support claims, or leaving placeholder classes behind as
      production dependencies.</side_effect_budget>

      <risk_probes>1. Root shim remains delegation-only while src/index owns composition.
      2. Shared registries/export files are changed in this single serial step to
      avoid merge conflicts. 3. Fake host and live Pi paths use the same real modules,
      not separate demo implementations.</risk_probes>

      '
    verification: '- [ ] Grep output for `_Runtime`, `_Stub`, `_Placeholder`, `NotImplementedError`,
